StylesPath = .github/styles
MinAlertLevel = warning

[*.md]
BasedOnStyles = Google

# First-person voice ("I wrote...", "My role:") is intentional throughout
# this personal portfolio — About Me, Context callouts, and contribution
# write-ups are all authored in first person. Vanilla Google style assumes
# third-person reference docs and flags this by default.
Google.FirstPerson = NO
Google.We = NO

# The memo and meeting notes in the SimpliCompense suite are deliberately
# written as real workplace documents that reference genuine future events
# (a scheduled launch date, a scheduled meeting) — future tense is correct
# there, not a style violation.
Google.Will = NO

# "Bold label: value" is used throughout as a deliberate convention (memo
# header fields, persona attributes, Context callouts, Problem/Contribution/
# Impact write-ups) — not a sentence-continuation colon this rule expects.
Google.Colons = NO

# One quoted maintainer comment uses a genuine mid-quote ellipsis to mark
# an omission, not stylistic trailing-off.
Google.Ellipses = NO

